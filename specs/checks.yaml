version: 1

# Index of validation authorities, not a second command registry.
module_defaults:
  validations_from: module.yaml:test_commands

repo:
  execution_order: [module_tests, boundary_checks, repo_wide_checks]
  policy: specs/agent-quality-rules.yaml
  diff_profiles: specs/gate-profiles.yaml
  execution: Makefile
  ci: .github/workflows/quality-gates.yml
  security_analysis: .github/workflows/codeql.yml
  entrypoints:
    current_diff: make validate-diff
    preview: make validate-diff-dry
    source_contracts: make check
    full_go: make gates
    root_and_references: make go-gates
    lint: make lint
    website: make website-gates
    local_push: make pre-push-check
  extension_evidence:
    policy: specs/extension-beta-evidence.yaml
    checker: internal/checks/extension-beta-evidence
    snapshot_tool: internal/checks/extension-api-snapshot
