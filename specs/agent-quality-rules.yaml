version: 1

authority:
  human_readable:
    - docs/operations/agent-code-quality-rules.md
  companions:
    - AGENTS.md
    - docs/operations/codex-workflow.md
    - docs/operations/agent-context-budget.md
    - docs/reference/canonical-style-guide.md
    - specs/repo.yaml
    - specs/dependency-rules.yaml
    - specs/checks.yaml

rule_levels:
  must:
    - stable_roots_must_not_import_x
    - no_unapproved_non_stdlib_dependency
    - preserve_net_http_compatibility
    - behavior_changes_require_tests
    - auth_verification_signature_policy_fail_closed
    - never_log_or_return_secrets_tokens_signatures_private_keys
    - no_hidden_globals_init_registration_or_context_service_locator
    - exported_symbol_changes_migrate_all_callers
    - http_json_apis_use_contract_write_response_and_write_error
  should:
    - one_primary_module_per_change
    - prefer_stdlib_and_existing_local_patterns
    - tests_live_next_to_changed_behavior
    - route_handler_middleware_wiring_is_grep_friendly
    - document_implemented_behavior_only
    - run_module_checks_then_boundary_checks_then_repo_gates
    - load_smallest_safe_context_package
    - summarize_validation_output_compactly
  may:
    - extract_small_helper_for_clear_local_repetition
    - skip_go_gates_for_docs_only_changes
    - keep_compatibility_layer_with_explicit_migration_window
    - split_broad_work_into_analysis_or_task_card

preflight:
  required_fields:
    - context_package
    - owning_module
    - target_module_manifest_read
    - in_scope_paths
    - out_of_scope_paths
    - public_api_impact
    - dependency_impact
    - behavior_impact
    - security_impact
    - docs_impact
    - validation_plan
  stop_conditions:
    - unclear_ownership
    - unclear_dependency_impact
    - unclear_stable_public_api_impact
    - unclear_cross_module_boundary
    - context_package_exceeds_task_scope

context_budget:
  authority: docs/operations/agent-context-budget.md
  packages:
    startup:
      purpose: Initial task orientation.
      default_reads:
        - AGENTS.md
        - matching specs/task-routing.yaml entry
    implementation:
      purpose: Normal code or docs changes.
      default_reads:
        - startup package
        - target module.yaml when module behavior changes
        - matching change recipe when applicable
        - directly relevant module primer or style section
    review:
      purpose: Findings-first review.
      default_reads:
        - startup package
        - docs/operations/agent-code-quality-rules.md review output contract
        - relevant module manifests or specs for the diff area
    control_plane:
      purpose: Workflow, architecture, quality, boundary, or spec rule changes.
      default_reads:
        - startup package
        - docs/operations/codex-workflow.md
        - docs/operations/agent-code-quality-rules.md
        - directly changed specs
  split_before_implementation_when:
    - more_than_one_primary_module
    - more_than_five_files
    - more_than_three_validation_commands
    - unclear_public_api_dependency_security_or_boundary_impact
  validation_summary_fields:
    - command
    - status
    - key_failure
    - next_step

module_quality_focus:
  core:
    - lifecycle_order
    - route_registration_errors
    - visible_middleware_attachment
    - controllable_shutdown
    - not_feature_catalog
    - partial_start_rollback_errors_and_cleanup_retry
    - readiness_tracks_lifecycle_state
  router:
    - static_param_group_method_reverse_route_tests
    - no_response_writing
    - no_auth_policy
    - no_business_validation
    - grep_friendly_matching
    - dead_end_fallback_preserves_complete_match_priority
    - cold_hot_cache_head_404_405_allow_equivalence
  contract:
    - stable_error_codes
    - stable_response_shape
    - encode_and_write_failure_response_ownership
    - transport_primitives_only
    - with_from_context_accessors
    - inlined_unexported_zero_value_struct_context_keys
    - no_new_response_helper_families
    - no_new_specific_error_constructors
    - remove_deprecated_symbols_after_migration
  middleware:
    - next_called_once_on_pass_through_and_never_after_rejection
    - ordering_and_error_path_tests
    - transport_only
    - no_business_service_injection
    - no_business_dto_assembly
    - no_domain_policy_branching
    - fallible_constructors_return_error
  security:
    - timing_safe_secret_token_signature_comparison
    - fail_closed
    - invalid_token_and_signature_negative_tests
    - no_sensitive_logs_or_responses
    - no_context_service_locator_for_security_state
  store:
    - concurrent_read_write_safety
    - context_cancellation
    - testable_persistence_behavior
    - commit_boundary_memory_disk_consistency_and_retry
    - no_core_router_middleware_security_or_x_imports
  health:
    - stable_models_separate_from_extension_orchestration
    - unknown_and_failed_checks_do_not_report_ready
    - stale_results_cannot_overwrite_newer_state
    - detached_snapshots_and_final_close
    - no_backend_error_text_in_health_responses
  log:
    - structured_numeric_precision
    - bounded_cyclic_field_conversion
    - escaped_text_controls_and_delimiters
    - no_payload_leak_in_fallback_or_writer_diagnostics
    - nested_field_ownership_and_shared_writer_synchronization
  metrics:
    - synchronized_record_reset_and_snapshot
    - detached_snapshot_maps
    - isolated_fanout_labels
    - concurrent_total_and_reset_invariants
    - documented_multi_collector_snapshot_atomicity
  x_tenant:
    - tenant_isolation
    - quota_policy_session_negative_tests
    - no_tenant_behavior_in_stable_middleware_or_store

anti_patterns:
  - stable_package_importing_x
  - unapproved_new_dependency
  - context_based_service_lookup
  - package_level_mutable_registry
  - init_side_effect_registration
  - route_auto_discovery
  - reflection_based_route_wiring
  - middleware_building_business_dtos
  - middleware_injecting_business_services
  - ad_hoc_json_response_helper
  - per_feature_error_envelope
  - new_handler_signature
  - new_panic_only_constructor_for_fallible_behavior
  - generic_utils_package_for_new_library_code
  - compatibility_wrapper_without_removal_plan
  - deprecated_symbol_left_after_caller_migration

quality_acceptance:
  dimensions:
    - module_ownership
    - public_contract
    - state_and_resource_transitions
    - classifiable_errors_and_cleanup_failures
    - concurrency_and_mutable_data_ownership
    - context_cancellation_and_commit_boundary
    - locally_understandable_control_flow
    - caller_driven_abstraction
    - fail_closed_and_sensitive_data_protection
    - capacity_and_measured_performance
    - behavioral_tests_and_implemented_docs
  evidence_statuses:
    - reproduced
    - source_confirmed
    - unverified
  severity:
    P0: exploitable_auth_bypass_serious_credential_exposure_or_widespread_irreversible_data_corruption
    P1: demonstrated_correctness_or_resource_state_failure
    P2: localized_reliability_contract_maintenance_or_critical_test_gap
    P3: local_readability_improvement_without_correctness_impact
  review_policy:
    - do_not_report_unverified_hypotheses_as_confirmed_defects
    - test_pass_is_not_complete_module_audit
    - no_function_line_count_gate
    - code_identifiers_and_code_comments_in_english
    - lint_and_website_build_are_separate_from_make_gates

review_output:
  findings_first: true
  finding_fields:
    - severity
    - title
    - file
    - trigger
    - observed_behavior
    - expected_behavior
    - evidence_status
    - problem
    - impact
    - minimal_fix
    - missing_test
  trailing_sections:
    - boundary_status
    - validation_status
    - docs_sync
    - residual_risk
  priorities:
    - boundary_violation
    - stable_root_imports_x
    - net_http_compatibility_risk
    - hidden_global_or_context_service_locator
    - fail_open_security_behavior
    - response_or_error_path_drift
    - missing_behavior_tests
    - docs_config_or_example_drift

gate_matrix:
  source: specs/gate-profiles.yaml
  execution: Makefile

handoff:
  required_sections:
    - context_package
    - owning_module
    - files_changed
    - boundary_impact
    - api_dependency_impact
    - tests_added_or_updated
    - validation_commands_run
    - docs_sync_impact
    - residual_risk
