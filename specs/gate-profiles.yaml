version: 1

# Machine-readable gate profiles. Used by `plumego agents validate-diff`
# and `make validate-diff` to select the minimal sufficient validation
# profile for the current git diff without manual inference.
#
# {module} in commands is substituted with the actual module path.

profiles:
  website_only:
    description: Website content, scripts, and configuration
    commands:
      - "make website-gates"

  docs_only:
    description: Markdown documentation and task records
    commands: []

  single_module_behavior:
    description: Single extension or standalone module change
    commands:
      - "go -C {module} test -race -timeout 60s ./..."
      - "go -C {module} vet ./..."

  stable_root_change:
    description: Change to any stable root
    commands:
      - "go -C {module} test -race -timeout 60s ./..."
      - "go -C {module} vet ./..."
      - "make boundary-check api-check"

  cross_module_public_api_release:
    description: Cross-module change, public API change, or release-relevant change
    commands:
      - "make gates"

# How to select a profile automatically (used by validate-diff):
# Cross-module behavior takes precedence over any primary-module profile.
# Stable-root rules apply only to single-module changes, regardless of order.
selection_rules:
  - id: website_only
    description: Website changes use the website checks instead of Go package paths
    path_patterns: ["website/**"]
    use: website_only

  - id: docs_only
    description: All changed files are Markdown
    path_patterns: ["*.md"]
    use: docs_only

  - id: control_plane
    description: Executable tooling, configuration, and non-Markdown documentation assets require repository validation
    path_patterns: ["specs/**", ".github/**", ".githooks/**", "internal/**", "cmd/**", "docs/**", "tasks/**", "Makefile", ".golangci.yml", "go.mod", "go.sum", "plumego.go", "env.example"]
    use: cross_module_public_api_release

  - id: cross_module
    description: Changed paths span multiple distinct modules or touch public API
    use: cross_module_public_api_release

  - id: stable_root
    description: All stable roots share one gate profile
    modules: [core, router, contract, middleware, security, store, health, log, metrics]
    use: stable_root_change

  - id: default
    description: Extension module or unrecognized module
    use: single_module_behavior
