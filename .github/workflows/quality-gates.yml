name: quality-gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
      - release/**
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go gates and save the measured coverage profile
        run: make go-gates COVERAGE_FILE="${{ runner.temp }}/plumego-stable.cover"

      - name: Install golangci-lint
        run: |
          set -euo pipefail
          # Pinned version for reproducible gates; Dependabot tracks the
          # install script via the github-actions ecosystem only for actions,
          # so bump this version deliberately alongside a local lint run.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0

      - name: Run golangci-lint
        run: PATH="$(go env GOPATH)/bin:$PATH" make lint

      - name: Run fuzz smoke tests
        run: |
          set -euo pipefail
          # Give each fuzz target a short budget to catch panics and invariant
          # violations on arbitrary inputs.
          for pkg in ./contract ./security/jwt ./security/password ./router ./x/websocket; do
            targets="$(go test -list '^Fuzz' "$pkg")"
            while IFS= read -r target; do
              [[ "$target" == Fuzz* ]] || continue
              echo "Fuzzing $pkg: $target"
              go test -run '^$' -fuzz "^${target}$" -fuzztime 10s "$pkg"
            done <<< "$targets"
          done

      - name: Upload measured coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ runner.temp }}/plumego-stable.cover
          retention-days: 30

      - name: Publish coverage trend
        uses: codecov/codecov-action@v7
        with:
          files: ${{ runner.temp }}/plumego-stable.cover
          fail_ci_if_error: false

  go-submodule-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cmd/plumego/go.mod

      - name: Run CLI vet and tests
        run: make cli-check

  go-cross-platform-gates:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test: true
          # Windows runs compile-time gates only: several test suites use
          # unix-shaped paths and ports, and vet+build still catches
          # platform-conditional code and missing build tags.
          - os: windows-latest
            test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build all packages
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        if: matrix.test
        run: go test -timeout 60s ./...

  website-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Validate website
        run: make website-gates

  benchmark-quality-gates:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: reference/benchmark/go.mod

      - name: Run benchmarks
        working-directory: reference/benchmark
        run: |
          set -euo pipefail
          go test -bench=. -benchmem -count=3 -timeout 180s ./... 2>&1 | tee benchmark.txt

      - name: Comment benchmark results
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const output = fs.readFileSync("reference/benchmark/benchmark.txt", "utf8");
            const body = [
              "### Plumego benchmark results",
              "",
              "```text",
              output.slice(0, 60000),
              "```"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  v1-release-readiness:
    needs:
      - go-quality-gates
      - go-submodule-quality-gates
      - go-cross-platform-gates
      - website-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm required quality jobs passed
        run: echo "All required quality jobs passed."
