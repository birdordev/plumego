name: "plumego CodeQL Config"

# Skip prose and vendored example apps; the library tree is analyzed in full.
paths-ignore:
  - "docs/**"
  - "examples/**"
  - "website/**"

queries:
  - uses: security-and-quality

# HTML escaping helpers used across middleware and handlers live in:
#   - internal/httputil/html.go    (HTMLEscape, JSEscape, URLQueryEscape)
#   - security/input/input.go      (BestEffortSanitizeHTML, lossy cleanup pass)
# Reflected-content alerts in transport plumbing are usually false positives
# because responses are written through contract helpers; genuine HTML output
# goes through the helpers above.
