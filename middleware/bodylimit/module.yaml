name: bodylimit
path: middleware/bodylimit
layer: stable
status: ga
owner: transport
risk: low
summary: Request body size limit middleware that bounds reads and emits errors through the response owner.

strict_boundary: transport_primitives

responsibilities:
  - Enforce a maximum request body size
  - Record read overruns without writing responses from the reader
  - Emit a structured error through the response owner before final commitment
  - Wrap the request body with a limited reader

non_goals:
  - Content-type validation
  - Request body parsing or inspection
  - Streaming body size enforcement

public_entrypoints:
  - Middleware
  - Config
  - DefaultConfig

allowed_imports:
  - stdlib
  - middleware
  - log

forbidden_imports:
  - core/**
  - store/**
  - x/**

test_commands:
  - go test -race -timeout 30s ./middleware/bodylimit/...
  - go vet ./middleware/bodylimit/...

review_checklist:
  - next must be called exactly once
  - Error response must not leak internal details
  - Keep responsibility transport-only

agent_hints:
  - Body limit is a transport-level safeguard, not a business validation rule
