name: kv
path: store/kv
layer: stable
status: ga
owner: persistence
risk: medium
summary: Embedded key-value store backed by a JSON snapshot, with TTL support and concurrent-safe operations.

strict_boundary: persistence_primitives

responsibilities:
  - Provide concurrent-safe key-value operations over an in-memory snapshot
  - Persist mutations to a single JSON snapshot in the required data directory
  - Support TTL-based expiration and statistics

non_goals:
  - Durable WAL or snapshot-based KV engines
  - Sharding or distributed KV topology
  - Serializer selection or compression

public_entrypoints:
  - NewKVStore
  - KVStore
  - Config
  - Options
  - DefaultConfig
  - DefaultOptions
  - Stats

allowed_imports:
  - stdlib

forbidden_imports:
  - core/**
  - middleware/**
  - x/**

test_commands:
  - go test -race -timeout 30s ./store/kv/...
  - go vet ./store/kv/...

review_checklist:
  - Must be safe for concurrent use
  - Keep APIs transport-agnostic
  - Keep WAL, sharding, and durable engine features out of stable layer

agent_hints:
  - Stable embedded KV requires an explicit data directory for its JSON snapshot
  - Durable WAL-based KV engines and sharding belong in x/data/kvengine
