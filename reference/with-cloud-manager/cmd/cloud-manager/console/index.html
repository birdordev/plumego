<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云资源管理</title>
  <link rel="stylesheet" href="/console/styles.css">
  <script src="/console/app.js" defer></script>
</head>
<body>
  <section id="entry" class="entry">
    <form id="login" class="login">
      <p class="brand"><span class="mark" aria-hidden="true"></span>云资源管理</p>
      <h1>进入项目控制台</h1>
      <label>租户 ID<input id="tenant" name="tenant" required maxlength="256" autocomplete="organization"></label>
      <button class="primary">使用企业身份登录</button>
      <p id="login-message" class="notice" role="status"></p>
      <noscript>请启用 JavaScript 后登录。</noscript>
    </form>
  </section>

  <div id="workspace" class="workspace" hidden>
    <aside class="rail">
      <p class="brand"><span class="mark" aria-hidden="true"></span>云资源管理</p>
      <label class="project-label">当前项目<select id="project" aria-label="当前项目"></select></label>
      <nav id="navigation" aria-label="项目功能">
        <button type="button" data-view="assets" aria-current="page">资源清单</button>
        <button type="button" data-view="operations">操作记录</button>
        <button type="button" data-view="service-catalog">服务目录</button>
        <button type="button" data-view="alerts">项目告警</button>
        <button type="button" data-view="console-grants" id="native-nav" hidden>原生控制台</button>
        <button type="button" data-view="batch">批量操作</button>
        <button type="button" data-view="audit" id="audit-nav" hidden>项目审计</button>
      </nav>
      <button type="button" id="logout" class="logout">退出控制台</button>
    </aside>
    <main id="content" tabindex="-1">
      <header class="heading">
        <h1 id="title">资源清单</h1>
        <p id="identity" class="identity"></p>
      </header>
      <p id="workspace-message" class="notice" role="status"></p>

      <section id="collection" aria-labelledby="title">
        <div id="asset-tools" class="filters" hidden>
          <button id="allocate-elastic-ip" type="button" class="primary">申请弹性公网 IP</button>
        </div>
        <div id="native-tools" class="filters" hidden>
          <button id="native-refresh" type="button">刷新访问申请</button>
        </div>
        <div id="catalog-tools" class="filters" hidden>
          <button id="catalog-create" class="primary" type="button" hidden>发布模板</button>
          <button id="catalog-refresh" type="button">刷新目录</button>
          <button id="catalog-retry" type="button" hidden>重试待确认的申请</button>
        </div>
        <form id="filters" class="filters">
          <label id="search-filter">名称、ID 或公网地址<input name="q" maxlength="256"></label>
          <label id="account-filter">账号<input name="account" maxlength="128"></label>
          <label id="kind-filter">类型<select name="kind">
            <option value="">全部类型</option><option value="instance">实例</option><option value="volume">卷</option><option value="snapshot">云盘快照</option>
            <option value="network">网络</option><option value="subnet">子网</option>
            <option value="elastic-ip">弹性公网 IP</option>
            <option value="security-group">安全组</option><option value="security-group-rule">安全组规则</option><option value="image">镜像</option>
          </select></label>
          <label id="status-filter" hidden>状态<select name="status">
            <option value="">全部状态</option><option value="awaiting_approval">待审批</option>
            <option value="queued">已排队</option><option value="applying">执行中</option>
            <option value="observing">观测中</option><option value="needs_review">待复核</option>
            <option value="succeeded">成功</option><option value="failed">失败</option>
          </select></label>
          <label class="alert-filter" hidden>告警状态<select name="alert_status">
            <option value="active">未恢复</option><option value="open">待确认</option><option value="acknowledged">已确认</option>
            <option value="resolved">已恢复</option><option value="all">全部</option>
          </select></label>
          <label class="alert-filter" hidden>告警规则<select name="rule">
            <option value="">全部规则</option><option value="operation_review">操作待复核</option><option value="operation_delayed">操作超时</option>
            <option value="scan_failures">连续盘点失败</option><option value="scan_stale">盘点数据过期</option>
          </select></label>
          <label class="audit-filter" hidden>事件类型<select name="category">
            <option value="">全部事件</option><option value="account">云账号</option><option value="ownership">资产归属</option>
            <option value="operation">操作状态</option><option value="approval">审批</option>
            <option value="resolution">人工处置</option><option value="observation">续查</option><option value="catalog">服务目录</option><option value="alert">项目告警</option><option value="console_access">原生控制台</option>
          </select></label>
          <label class="audit-filter" hidden>对象 ID<input name="subject_id" maxlength="512"></label>
          <label class="audit-filter" hidden>开始时间<input name="from" type="datetime-local"></label>
          <label class="audit-filter" hidden>截止时间<input name="until" type="datetime-local"></label>
          <button class="primary">筛选</button>
        </form>
        <div class="table-scroll" tabindex="0" aria-label="结果列表">
          <table><thead id="columns"></thead><tbody id="items"></tbody></table>
        </div>
        <footer class="table-actions">
          <button id="selected" type="button" hidden>使用已选实例</button>
          <button id="audit-export" type="button" hidden>下载审计 CSV</button>
          <button id="more" type="button" hidden>加载下一页</button>
        </footer>
      </section>

      <section id="batch" aria-labelledby="title" hidden>
        <form id="batch-editor">
          <div class="batch-top">
            <label>应用到已选实例<select id="batch-action">
              <option value="start">启动</option><option value="stop">停止</option>
              <option value="reboot">重启</option><option value="delete">删除</option>
            </select></label>
            <button id="fill-batch" type="button" hidden>填入所选实例</button>
          </div>
          <label>批次请求 JSON<textarea id="batch-input" rows="12" spellcheck="false" aria-describedby="batch-help"></textarea></label>
          <p id="batch-help" class="hint">每批最多 25 项。预览通过后可提交。</p>
          <div class="row-actions">
            <button id="preview-batch" type="submit" class="primary">预览批次</button>
            <button id="submit-batch" type="button" disabled>提交批次</button>
          </div>
        </form>
        <div id="batch-report" class="batch-report" hidden></div>
        <form id="lookup-batch" class="filters batch-lookup">
          <label>批次 ID<input id="batch-id" required maxlength="128"></label>
          <button>查看批次</button>
        </form>
      </section>
    </main>
  </div>

  <dialog id="detail" aria-labelledby="detail-title">
    <header class="detail-header"><h2 id="detail-title">操作详情</h2><button type="button" id="close-detail">关闭</button></header>
    <p id="detail-message" class="notice" role="status"></p>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
